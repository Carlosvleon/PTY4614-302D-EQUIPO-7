# SPA + proxy opcional /api → servicio compose `api`
# Si VITE_API_URL es absoluta (otro host), el proxy /api no se usa desde el browser.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Permite payloads JSON con logos/sellos en base64 (Empresa.plantillaDoc).
  client_max_body_size 15m;

  # Assets con hash: cache agresivo
  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # API vía reverse proxy al contenedor Nest (mismo origen que el front)
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://api:3001/api/;
  }

  # React Router (SPA)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
